name: Branch Protection Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Check for sensitive data
      run: |
        echo "🔒 Checking for sensitive data..."
        if grep -r "sk_live_" . --exclude-dir=node_modules --exclude-dir=.git; then
          echo "❌ Found live Stripe keys in code!"
          exit 1
        fi
        if grep -r "pk_live_" . --exclude-dir=node_modules --exclude-dir=.git; then
          echo "❌ Found live publishable keys in code!"
          exit 1
        fi
        echo "✅ No sensitive keys found"
    
    - name: Check for customer data files
      run: |
        echo "🔒 Checking for customer data files..."
        if [ -f "orders.json" ]; then
          echo "❌ Found orders.json file with customer data!"
          exit 1
        fi
        if [ -f "customer-data.json" ]; then
          echo "❌ Found customer-data.json file!"
          exit 1
        fi
        echo "✅ No customer data files found"
    
    - name: Verify .gitignore
      run: |
        echo "🔒 Checking .gitignore..."
        if ! grep -q "orders.json" .gitignore; then
          echo "❌ orders.json not in .gitignore!"
          exit 1
        fi
        echo "✅ .gitignore is properly configured"

  approve-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Auto-approve PR from owner
      if: github.event.pull_request.user.login == github.repository_owner
      run: |
        echo "🤖 Auto-approving PR from repository owner"
        # Note: You'll need to set up a GitHub token for this
