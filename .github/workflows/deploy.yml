name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Build
      run: |
        npm install
        # Create dist directory
        mkdir -p dist
        # Copy static files
        cp *.html dist/
        cp -r styles dist/
        cp -r images dist/
        cp books.json dist/
        cp script.js dist/
        # Create .nojekyll file
        touch dist/.nojekyll
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-workflow@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: main
